<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">▦</span>
    <div>
      <h1>Agent Office</h1>
      <div class="sub" id="repo-name">…</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="pill" id="merge-mode" title="Chế độ merge"></span>
    <span class="conn" id="conn" title="Kết nối realtime"><i></i><span>đang kết nối</span></span>
    <div class="runner">
      <span id="runner-state" class="runner-state">Runner: …</span>
      <button id="runner-btn" class="btn primary">Bắt đầu</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="main-col">
    <div class="agents" id="agents"></div>

    <div class="card attention" id="attention" hidden>
      <h2>Cần anh trả lời</h2>
      <div id="attention-list"></div>
    </div>

    <form class="card request-form" id="request-form">
      <h2>Yêu cầu mới cho team</h2>
      <textarea id="request-text" rows="3" placeholder="Ví dụ: Tôi cần CLI `sportscut cut match.mp4` xuất 10 clip highlight bóng đá…"></textarea>
      <div class="row">
        <span class="hint" id="request-hint">Claude sẽ tách task, chỉ hỏi lại khi yêu cầu chưa rõ.</span>
        <button class="btn primary" type="submit">Gửi yêu cầu</button>
      </div>
    </form>

    <div class="requests" id="requests"></div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="card waiting" id="waiting" hidden>
      <h2>Đang chờ</h2>
      <ul id="waiting-list"></ul>
    </div>
  </section>

  <aside class="side-col">
    <div class="card feed-card">
      <div class="feed-head">
        <h2>Hoạt động</h2>
        <button class="btn ghost small" id="runner-log-btn">Log runner</button>
      </div>
      <ol class="feed" id="feed"></ol>
    </div>
  </aside>
</main>

<dialog id="drawer" class="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-id" id="d-id"></div>
      <h2 id="d-title"></h2>
    </div>
    <button class="btn ghost" id="d-close" aria-label="Đóng">✕</button>
  </div>
  <nav class="tabs" id="d-tabs">
    <button data-tab="overview" class="active">Tổng quan</button>
    <button data-tab="notes">Review &amp; test</button>
    <button data-tab="history">Lịch sử</button>
    <button data-tab="logs">Log</button>
  </nav>
  <div class="drawer-body" id="d-body"></div>
</dialog>

<dialog id="logdlg" class="drawer">
  <div class="drawer-head">
    <h2 id="log-title">Log</h2>
    <button class="btn ghost" id="log-close" aria-label="Đóng">✕</button>
  </div>
  <pre class="log" id="log-body"></pre>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
