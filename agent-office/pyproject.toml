[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-office"
version = "0.1.0"
description = "Multi-agent dev office: Claude Code (PM, tech lead, reviewer) + Codex (developer, tester), subscription logins only"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
office = "agent_office.cli:main"

[tool.setuptools.packages.find]
include = ["agent_office*"]

[tool.setuptools.package-data]
agent_office = ["prompts/*.md", "dashboard/static/*", "dashboard/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
