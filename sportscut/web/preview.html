<!doctype html>
<html lang="vi"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SportsCut — Xem trước và chỉnh highlight</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/timefmt.js" defer></script>
  <script src="/static/filters.js" defer></script>
  <script src="/static/metafmt.js" defer></script>
  <script src="/static/preview.js" defer></script>
</head><body><main class="preview">
  <p><a href="/">← Tải video khác</a></p>
  <h1 id="job-title">Xem trước highlight</h1>
  <video id="player" controls preload="metadata"></video>
  <p>Thời điểm hiện tại: <output id="current-time">00:00.0</output></p>
  <div id="filters" role="group" aria-label="Lọc theo sự kiện">
    <button type="button" id="filter-all" aria-pressed="true">Tất cả</button>
    <button type="button" class="chip" data-event="goal" aria-pressed="false">Bàn thắng</button>
    <button type="button" class="chip" data-event="save" aria-pressed="false">Cứu thua</button>
    <button type="button" class="chip" data-event="red_card" aria-pressed="false">Thẻ đỏ</button>
    <button type="button" class="chip" data-event="controversy" aria-pressed="false">Tranh cãi</button>
    <button type="button" class="chip" data-event="other" aria-pressed="false">Khác</button>
    <button type="button" id="preset-goals" aria-pressed="false">Chỉ bàn thắng</button>
    <button type="button" id="preset-top5" aria-pressed="false">Top 5 pha hay</button>
    <output id="filter-count"></output>
  </div>
  <ol id="segments"></ol>
  <template id="segment-row"><li class="segment">
    <button type="button" class="play">▶ Phát đoạn</button>
    <span class="event-badge"></span>
    <label>Đầu <input class="start" type="text" inputmode="decimal" placeholder="mm:ss.s"></label>
    <button type="button" class="start-minus">−0.5 s</button>
    <button type="button" class="start-plus">+0.5 s</button>
    <button type="button" class="set-start">Đầu = hiện tại</button>
    <label>Cuối <input class="end" type="text" inputmode="decimal" placeholder="mm:ss.s"></label>
    <button type="button" class="end-minus">−0.5 s</button>
    <button type="button" class="end-plus">+0.5 s</button>
    <button type="button" class="set-end">Cuối = hiện tại</button>
    <button type="button" class="delete">Xóa</button>
    <a class="clip" download hidden>Tải clip</a>
    <video class="clip-player" controls preload="none" hidden></video>
    <button type="button" class="voiceover" aria-pressed="false" hidden>Lồng tiếng</button>
  </li></template>
  <button type="button" id="add-segment">Thêm đoạn tại thời điểm hiện tại</button>
  <button type="button" id="save">Lưu</button>
  <section id="meta" hidden>
    <h2>Tiêu đề, mô tả và hashtag</h2>
    <ol id="meta-list"></ol>
    <button type="button" id="save-meta" disabled>Lưu tiêu đề và hashtag</button>
  </section>
  <template id="meta-row"><li class="meta-item">
    <h3 class="meta-name"></h3>
    <label>Tiêu đề <input class="meta-title" type="text"></label>
    <label>Mô tả <textarea class="meta-caption" rows="3"></textarea></label>
    <label>Hashtag <input class="meta-hashtags" type="text" placeholder="#BongDa #Highlight"></label>
    <button type="button" class="copy">Sao chép</button>
  </li></template>
  <p id="status" role="status" hidden></p>
  <p id="error" role="alert" aria-live="assertive" hidden></p>
</main></body></html>
